name: validate-themes

# Helper only: validates theme files on every PR and push. It never merges,
# approves, or otherwise gates a merge by itself -- merging is always by
# maintainer review (see CONTRIBUTING.md).

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: npm

      - name: Install frontend lockfile
        run: npm ci

      - name: Run repo validator (scripts/validate_themes.py)
        run: python3 scripts/validate_themes.py

      - name: Install check-jsonschema
        run: pip install check-jsonschema

      - name: Validate every theme file against schema/theme.schema.json
        run: |
          shopt -s globstar
          check-jsonschema --schemafile schema/theme.schema.json themes/**/*.json

      - name: Rebuild generated theme index (scripts/build_index.py)
        run: python3 scripts/build_index.py

      - name: Rebuild generated swatches (scripts/build_swatches.py)
        run: python3 scripts/build_swatches.py

      - name: Rebuild local silk previews (scripts/build_previews.py)
        run: python3 scripts/build_previews.py

      - name: Verify gallery frontend
        run: |
          npm run build
          npm test

      - name: Fail if generated assets are out of date
        run: git diff --exit-code -- assets docs/themes.json docs/assets/previews
